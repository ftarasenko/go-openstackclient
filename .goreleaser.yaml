# GoReleaser config — builds the 6-target matrix, cuts the GitHub Release, and
# publishes a Homebrew Cask to ftarasenko/homebrew-tap.
#
# Air-gap invariant: the Go build stays offline via -mod=vendor against the
# committed vendor/ (GoReleaser itself is fetched by CI, which is not air-gapped;
# only the compiled artifact must reproduce from vendor/).
#
# Release notes are NOT generated by GoReleaser: the changelog is disabled and
# the release body is set after publish via `gh release edit --notes-file`,
# produced by scripts/release-notes.sh (the single source of truth documented in
# AGENTS.md). Keep it that way so the Conventional-Commits → heading mapping does
# not fork.
version: 2

# Shell completions are generated from the CLI itself (cobra ships the
# `completion` command) and bundled into the archives and the .rpm/.deb.
#
# They are deliberately NOT a `before: hooks:` entry any more. GoReleaser hooks
# run inside the same workflow step as GoReleaser, and that step carries
# HOMEBREW_TAP_TOKEN — a fine-grained PAT with write access to a SECOND
# repository. Running `go run ./cmd/koc …` there means repository code (plus the
# whole vendor/ tree) executes with that token in scope on every release. So the
# generation moved out to `make completions`, run in its own secret-free step
# (see .github/workflows/release.yml); locally, run `make completions` before
# `goreleaser release/build`.
#
# NOTE: completions ride inside the tarballs for manual install; the Homebrew
# *cask* stages only the binary and cannot auto-wire completions into the
# shell's fpath (a formula could — casks have no completion stanza). Users
# installing via brew run `koc completion <shell>` themselves (see README). The
# .rpm/.deb DO install them to the system completion directories.

builds:
  - id: koc
    main: ./cmd/koc
    binary: koc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -mod=vendor # vendor/ is committed; build reproduces offline
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Byte-reproducibility: without this the binary's mtime is "now", so two
    # builds of the same tag differ and an air-gapped consumer cannot
    # independently re-derive the checksums. Pin it to the commit timestamp.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64] # -> 6 combos, matches the previous hand-rolled matrix

archives:
  - id: koc
    ids: [koc]
    formats: [tar.gz]
    name_template: "koc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # A tar/zip records every member's mtime, so `mod_timestamp` on the build is
    # not enough on its own: LICENSE, README and the generated completions would
    # still carry the runner's checkout/generation time and two builds of the
    # same tag would hash differently. Pin every member to the commit date.
    # (Careful: these mtime fields want RFC3339 — `.CommitDate` — while the
    # build's `mod_timestamp` wants unix seconds — `.CommitTimestamp`.)
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: completions/*
        dst: completions
        info:
          mtime: "{{ .CommitDate }}"
    format_overrides:
      - goos: windows
        formats: [zip]

# Linux system packages for the stated target: an air-gapped RHEL-derivative
# node, where Homebrew is useless. These drop into a local yum/apt mirror.
# nfpm only applies to the linux builds, so this yields 4 packages
# (rpm + deb, amd64 + arm64). ConventionalFileName gives each format the naming
# its own tooling expects — koc-<v>.x86_64.rpm, koc_<v>_arm64.deb — instead of
# GoReleaser's default archive-style name, so a local yum/apt mirror and the
# humans reading it see what they expect.
nfpms:
  - id: koc
    ids: [koc]
    package_name: koc
    formats: [rpm, deb]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: ftarasenko
    homepage: "https://github.com/ftarasenko/go-openstackclient"
    maintainer: "ftarasenko <ftarasenko@users.noreply.github.com>"
    description: "Single-binary OpenStack CLI for KeyStack (gophercloud v2)"
    license: "Apache-2.0"
    section: utils
    bindir: /usr/bin
    # Same reproducibility reason as the archives: without this, nfpm stamps
    # "now" into the package metadata and every member's mtime.
    mtime: "{{ .CommitDate }}"
    contents:
      - src: completions/koc.bash
        dst: /usr/share/bash-completion/completions/koc
      - src: completions/koc.zsh
        dst: /usr/share/zsh/site-functions/_koc
      - src: completions/koc.fish
        dst: /usr/share/fish/vendor_completions.d/koc.fish
      - src: LICENSE
        dst: /usr/share/doc/koc/LICENSE

checksum:
  name_template: checksums.txt

# SPDX SBOM per shipped artifact (syft), so an FSTEC/air-gapped consumer can run
# its own component review without unpacking the tarball. Requires `syft` on
# PATH — the release workflow installs it before GoReleaser runs.
#
# The per-artifact documents are delivered as ONE bundle rather than 10 loose
# `<artifact>.spdx.json` assets: with 10 real downloads the loose files made the
# release page 23 assets and buried the binaries. `artifacts: any` runs the
# command exactly once (no per-artifact fan-out), and scripts/sbom-bundle.sh does
# the syft-per-artifact loop itself, then tars the documents. Fidelity is
# unchanged — the tarball still holds one SPDX document per artifact.
#
# Critically this stays INSIDE the sbom pipe, which runs before `checksum` and
# `sign`: the bundle is registered as a GoReleaser document, so it is listed in
# checksums.txt and thereby covered by the cosign signature over it. Building it
# in a workflow step or attaching it via release.extra_files would put it outside
# that chain. (Verified: no checksum.extra_files entry is needed — an sbom
# document is a tracked artifact and is checksummed automatically.)
#
# NOTE cmd is `../scripts/…` because GoReleaser runs sbom commands with the
# working directory set to `dist/`. The two timestamp args are what let the
# script pin the tar's mtime and syft's `created` field to the same commit
# instant the builds/archives/packages are pinned to — syft ignores
# SOURCE_DATE_EPOCH, so without them the bundle's hash changes every run and the
# release stops being byte-reproducible.
sboms:
  - id: sboms
    artifacts: any
    cmd: ../scripts/sbom-bundle.sh
    documents: ["koc_{{ .Version }}_sboms.tar.gz"]
    args: ["$document", "{{ .CommitTimestamp }}", "{{ .CommitDate }}"]

# Keyless cosign signature over checksums.txt. checksums.txt alone is not an
# integrity story — whoever can swap an artifact in the release can swap the
# checksums with it — but a Sigstore-backed signature over it is: the signature
# roots the trust and the checksums chain to every artifact.
#
# Verify (the bundle carries signature, certificate and transparency-log
# inclusion proof, so it is the only extra file needed; no key distribution):
#   cosign verify-blob checksums.txt --bundle checksums.txt.bundle \
#     --certificate-identity-regexp 'https://github.com/ftarasenko/go-openstackclient/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   sha256sum -c checksums.txt
#
# --new-bundle-format is cosign v3's default, but it is named explicitly here on
# purpose: the previous config passed --output-signature/--output-certificate,
# and when that default flipped from false to true in v3 those flags became
# silently IGNORED ("deprecated when using --new-bundle-format and will be
# ignored") rather than an error. The release then produced no .sig/.pem at all,
# and because release.yml only runs on a v* tag, nothing would have caught it
# before the tag was already burned. Stating the format keeps this block correct
# under either default, and it is what makes an air-gapped `--trusted-root`
# verification possible (that flag requires the new format) — see SECURITY.md.
#
# Needs `id-token: write` in the release workflow (the OIDC token is what
# Fulcio signs) plus cosign on PATH — both wired in release.yml.
signs:
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.bundle"
    output: true
    args:
      - sign-blob
      - "--new-bundle-format"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# Release body comes from scripts/release-notes.sh via --release-notes; do not
# let GoReleaser also compute a changelog.
changelog:
  disable: true

homebrew_casks:
  - name: koc
    ids: [koc]
    repository:
      owner: ftarasenko
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/ftarasenko/go-openstackclient"
    description: "Single-binary OpenStack CLI for KeyStack (gophercloud v2)"
    license: "Apache-2.0"
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@ftarasenko.dev
    # The binary is unsigned (Go only ad-hoc-signs darwin/arm64 so it *runs*);
    # casks are quarantined on download, so strip the quarantine flag on install
    # or launch dies with "koc cannot be verified".
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "#{staged_path}/koc"]
          end
