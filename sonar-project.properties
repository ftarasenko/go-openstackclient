sonar.projectKey=go-openstackclient
sonar.projectName=go-openstackclient (koc)
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
# Pass the release tag at scan time so the "new code" period means "since the
# last release" rather than "since the previous scan" — otherwise a mechanical
# refactor re-attributes long-standing untested lines to new code:
#   -Dsonar.projectVersion=$(git describe --tags --abbrev=0)

# --- Sources ---
# Analyse the whole repo, minus vendored/generated/build artifacts and test code
# (test files are picked up separately via sonar.test.inclusions below).
sonar.sources=.
sonar.exclusions=\
  vendor/**,\
  dist/**,\
  completions/**,\
  koc,\
  koc-linux-*,\
  koc-darwin-*,\
  koc-windows-*,\
  koc-*/**,\
  coverage.out,\
  coverage.html,\
  **/*_test.go,\
  **/testdata/**
sonar.coverage.exclusions=\
  cmd/koc/main.go,\
  **/*_test.go,\
  **/testdata/**

# --- Tests ---
sonar.tests=.
sonar.test.inclusions=\
  **/*_test.go
sonar.test.exclusions=\
  vendor/**,\
  dist/**

# --- Coverage (optional; `go test -coverprofile=coverage.out ./...`) ---
sonar.go.coverage.reportPaths=coverage.out

# --- Rule scoping ---
# S3776 (cognitive complexity) on test code. koc's tests are table-driven with
# an inline httptest handler per case (AGENTS.md "Testing"); the metric reads
# that shape as nesting. Flattening it would mean abandoning the documented
# test pattern, so the rule is scoped to production code.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
