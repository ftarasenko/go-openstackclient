sonar.projectKey=go-openstackclient
sonar.projectName=go-openstackclient (koc)
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
# Pass the release tag at scan time so the "new code" period means "since the
# last release" rather than "since the previous scan" — otherwise a mechanical
# refactor re-attributes long-standing untested lines to new code:
#   -Dsonar.projectVersion=$(git describe --tags --abbrev=0)

# --- Sources ---
# Analyse the whole repo, minus vendored/generated/build artifacts and test code
# (test files are picked up separately via sonar.test.inclusions below).
sonar.sources=.
sonar.exclusions=\
  vendor/**,\
  dist/**,\
  completions/**,\
  koc,\
  koc-linux-*,\
  koc-darwin-*,\
  koc-windows-*,\
  koc-*/**,\
  coverage.out,\
  coverage.html,\
  **/*_test.go,\
  **/testdata/**
sonar.coverage.exclusions=\
  cmd/koc/main.go,\
  **/*_test.go,\
  **/testdata/**

# --- Tests ---
sonar.tests=.
sonar.test.inclusions=\
  **/*_test.go
sonar.test.exclusions=\
  vendor/**,\
  dist/**

# --- Coverage (optional; `go test -coverprofile=coverage.out ./...`) ---
sonar.go.coverage.reportPaths=coverage.out

# --- Rule scoping ---
# S3776 (cognitive complexity) on test code. koc's tests are table-driven with
# an inline httptest handler per case (AGENTS.md "Testing"); the metric reads
# that shape as nesting. Flattening it would mean abandoning the documented
# test pattern, so the rule is scoped to production code.
#
# e2 now subsumes e1. e1 is kept so that narrowing e2 to specific files later
# cannot silently re-expose the test tree.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go

# S3776 project-wide. The rule fires at 15; this project's threshold is 25,
# chosen deliberately and enforced by golangci-lint's gocognit on every commit
# (AGENTS.md "Build / test / lint" carries the reasoning). The two cannot be
# reconciled from here: the threshold is a rule *parameter*, it lives in the
# Quality Profile, and the Go profile in use is the built-in "Sonar way", which
# is read-only. So the rule is suppressed rather than re-parameterised.
#
# This is not a loss of coverage. Every finding it reported was one of two
# shapes the project has already decided to keep:
#   - a command's opts builder / RunE: one `if <flag>` branch per CLI flag,
#     linear and one level deep, so the metric tracks flag count rather than
#     difficulty (23 of 27 findings);
#   - a --wait poll loop: ctx timeout, ticker, transient-error tolerance and a
#     for/select, with the state decision already extracted behind a callback,
#     leaving only irreducible scaffolding (the other 4).
# Anything genuinely above 25 still fails `make lint` offline, before a scan
# ever runs — which is the gate every commit passes through.
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.go
