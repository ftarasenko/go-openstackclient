name: supply-chain

# NETWORK-ALLOWED checks. Everything here needs a module proxy, the Go
# vulnerability database, or the GitHub dependency graph, so it is deliberately
# kept OUT of ci.yml: none of these jobs is a dependency of the offline
# build/test/lint jobs, and none of them can weaken the air-gap invariant
# (`GOFLAGS=-mod=vendor GOPROXY=off CGO_ENABLED=0 go build ./...`).
on:
  push:
    branches:
      - master
      - "claude/**"
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory against a pinned dependency shows up
    # without waiting for the next push. Monday 04:17 UTC (off the hour, to avoid
    # the scheduling stampede).
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gap this closes: `-mod=vendor` does not consult go.sum, and the CI
  # vendor check in ci.yml only detects vendor/modules.txt drifting from go.mod.
  # Reproduced twice: appending a line to a vendored gophercloud source file
  # still gives a green `go build`, `go vet` AND `go mod verify`. So the only way
  # to know vendor/ is what upstream published is to re-derive it and diff.
  #
  # If this job fails: either an intentional dependency change did not run
  # `make tidy` (re-run it and commit vendor/ + go.mod + go.sum), or vendor/ was
  # edited by hand — which AGENTS.md forbids and this job now catches.
  vendor-integrity:
    name: vendor tree re-derives from upstream
    runs-on: ubuntu-latest
    env:
      GOFLAGS: "" # must NOT be -mod=vendor: this job rebuilds the vendor tree
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false

      # go mod verify checks the module cache against go.sum; combined with a
      # fresh download that means the bytes came from upstream unmodified.
      - name: Download modules and verify against go.sum
        run: |
          go mod download
          go mod verify

      # ...and this proves the committed vendor/ is exactly what those verified
      # modules produce. go mod vendor is deterministic, so any difference is a
      # real difference.
      - name: Re-derive vendor/ and diff against the committed tree
        run: |
          go mod vendor
          if ! git diff --exit-code -- vendor/ go.mod go.sum; then
            echo "::error::vendor/ does not match what 'go mod vendor' produces from the verified modules. Run 'make tidy' and commit vendor/, go.mod and go.sum."
            exit 1
          fi
          echo "vendor/ is byte-identical to the re-derived tree"

  # Known vulnerabilities in the dependency graph AND in the standard library of
  # the Go toolchain being used — the latter is what caught the release binaries
  # shipping the original go1.25.0 stdlib (crypto/x509 name constraints,
  # crypto/tls, encoding/pem, net/http HTTP/2).
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    env:
      GOFLAGS: "" # `go install pkg@version` rejects -mod=vendor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false

      # Installed from the Go module proxy (checksum-verified via sum.golang.org)
      # at a pinned version rather than via a third-party action, so there is no
      # extra action to trust or pin. Bump the version deliberately.
      - name: Install govulncheck v1.6.0
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: govulncheck ./...
        run: govulncheck ./...

  # The public Go API (pkg/) as a downstream importer sees it: test/importer is
  # a separate module that requires this one through a replace directive and
  # uses only pkg/ import paths. Go forbids it internal/, and it resolves its
  # own dependency graph rather than reading vendor/, so a pkg/ package that
  # only builds from inside this repository fails here. Network-allowed (the
  # nested module's graph comes from the proxy, checked against its go.sum),
  # hence here and not in the offline ci.yml.
  importer:
    name: pkg/ builds from another module
    runs-on: ubuntu-latest
    env:
      GOFLAGS: "" # the nested module has no vendor/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false

      - name: Test the importer module
        working-directory: test/importer
        run: |
          go mod verify
          go test ./...

      # The point of keeping cobra, pflag and x/term out of pkg/ (depguard in
      # .golangci.yml) is that an importer does not inherit them. Prove it on
      # the graph the importer actually builds.
      - name: The importer's graph carries no CLI dependency
        working-directory: test/importer
        run: |
          if go list -deps -test ./... | grep -E '^(github.com/spf13/|golang.org/x/term|github.com/ftarasenko/go-openstackclient/internal/)'; then
            echo "::error::pkg/ pulls a CLI-only dependency into an importer's build"
            exit 1
          fi

  # API compatibility of pkg/ against the latest release tag: an incompatible
  # change fails unless the commit range declares it breaking, as
  # pkg/openstack/doc.go's versioning section requires. Until the first tag
  # that carries pkg/, it only reports. The logic is scripts/api-compat.sh, so
  # the same check runs locally.
  api-compat:
    name: pkg/ API compatibility
    runs-on: ubuntu-latest
    env:
      GOFLAGS: "" # `go install pkg@version` rejects -mod=vendor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base tag and the commit range since it
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false

      # Pinned like govulncheck above: from the module proxy, checksum-verified
      # via sum.golang.org. x/exp has no tags, so this is the pseudo-version
      # golangci-lint v2.14.0 itself depends on. Bump it deliberately.
      - name: Install apidiff (x/exp v0.0.0-20250620022241-b7579e27df2b)
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20250620022241-b7579e27df2b

      - name: Compare pkg/ with the latest release
        run: scripts/api-compat.sh

  # Flags dependency additions/upgrades that carry a known advisory or an
  # incompatible license, on the PR that introduces them. Pull-request only: the
  # action compares the PR's dependency graph against the base ref.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to a full commit SHA per repo convention. On v5, whose only
      # breaking change was the node24 runtime (needs runner >= v2.327.1, which
      # ubuntu-latest satisfies); both inputs below are unchanged from v4.
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Apache-2.0 project; flag copyleft/unknown licences entering the graph.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0
