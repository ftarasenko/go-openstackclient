name: ci

on:
  push:
    branches:
      - master
      - "claude/**"
  pull_request:

permissions:
  contents: read

# Every job in this workflow is OFFLINE: -mod=vendor against the committed
# vendor/ with no module proxy. Anything that needs network (vendor integrity
# re-derivation, govulncheck, dependency review) lives in
# .github/workflows/supply-chain.yml and must never become a dependency of the
# jobs here — that is what keeps the air-gap invariant honest.
jobs:
  build-test:
    runs-on: ubuntu-latest
    # Enforce the air-gap requirement: build and test offline from the committed
    # vendor/ tree with no module proxy.
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      CGO_ENABLED: "0"
    steps:
      # Third-party actions are pinned to full commit SHAs (supply-chain
      # hygiene for the air-gapped/FSTEC target); the trailing comment records
      # the human-readable version each SHA corresponds to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Do NOT use `go-version-file: go.mod` here. go.mod pins a full patch
      # version (`go 1.25.0`), so setup-go resolves 1.25.0 EXACTLY and the
      # release binaries would ship the original 1.25.0 standard library — which
      # has dozens of known vulnerabilities, including crypto/x509 name-
      # constraint verification (GO-2025-4175), crypto/tls, encoding/pem
      # (GO-2025-4009, on input koc genuinely parses: CA bundles, Vault-supplied
      # certs, k8s secrets) and net/http HTTP/2 issues. A `1.25.x` range with
      # check-latest resolves to the newest 1.25 patch instead, without raising
      # the floor in go.mod (which would force a toolchain download and break the
      # offline build for contributors).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: false

      - name: Report Go toolchain version
        run: go version

      - name: go vet
        run: go vet ./...

      # A -mod=vendor build fails with "inconsistent vendoring" if vendor/ or
      # vendor/modules.txt drifts from go.mod, so this step doubles as the
      # air-gap vendor-consistency gate. It does NOT verify vendored file
      # contents — that is the vendor-integrity job in supply-chain.yml.
      - name: Build static binary (offline, from vendor/)
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=$(git describe --tags --always --dirty)" \
            -o koc ./cmd/koc
          file koc

      # A single binary is the whole product, so a size jump is a signal. Record
      # it in the log (and the step summary) so a regression is visible in the
      # build that caused it. No compression (deliberately no UPX: it breaks
      # checksum-based inventory, trips EDR packer heuristics, and inserts a
      # decompress step into a binary someone has to certify).
      - name: Record binary size
        run: |
          SIZE=$(stat -c%s koc)
          echo "koc size: ${SIZE} bytes ($((SIZE / 1024 / 1024)) MiB)"
          echo "\`koc\` binary size: **${SIZE}** bytes ($((SIZE / 1024 / 1024)) MiB)" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: go test ./...

  # The release ships six targets; CI used to compile one. A build-tag or
  # syscall mistake in a darwin/windows path was therefore first discovered at
  # release time. Build-only (no test binaries can run cross-platform), and
  # still fully offline so the air-gap invariant is not weakened.
  crossbuild:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        # Must stay in sync with .goreleaser.yaml `goos`/`goarch` and the
        # Makefile PLATFORMS list.
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: false

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }} (offline)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  # Race detector on the primary target. Separate job because -race requires
  # cgo (CGO_ENABLED=1), which the shipped static binaries must never use — so
  # it cannot share the build-test job's env. Still offline: vendor/ only.
  test-race:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: false

      - name: Test (race detector)
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: false

      # Pin the exact golangci-lint version used in development and verify the
      # download against the release's published SHA-256 checksums before
      # extracting, so a corrupted or swapped asset fails the build.
      - name: Install golangci-lint v2.5.0 (checksum-verified)
        env:
          GOPROXY: "" # allow the tool download (build/test stay offline)
        run: |
          VER=2.5.0
          TARBALL="golangci-lint-${VER}-linux-amd64.tar.gz"
          BASE="https://github.com/golangci/golangci-lint/releases/download/v${VER}"
          curl -sSfL "${BASE}/${TARBALL}" -o "${TARBALL}"
          curl -sSfL "${BASE}/golangci-lint-${VER}-checksums.txt" -o checksums.txt
          # sha256sum -c matches by the filename recorded in checksums.txt, so the
          # tarball must be on disk under its canonical name.
          grep " ${TARBALL}\$" checksums.txt | sha256sum -c -
          tar -xzf "${TARBALL}"
          sudo mv "golangci-lint-${VER}-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint
          golangci-lint version

      - name: golangci-lint
        run: golangci-lint run ./...
